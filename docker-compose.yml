services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ct_orderlauf
      DB_USER: ct_user
      DB_PASS: ct_secret

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ct_orderlauf
      MYSQL_USER: ct_user
      MYSQL_PASSWORD: ct_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migrations/20260412_transgourmet_ordersatz_items.sql:/docker-entrypoint-initdb.d/03-migrate-transgourmet-ordersatz.sql:ro
      - ./database/migrations/20260413_cleanup_duplicate_items.sql:/docker-entrypoint-initdb.d/04-migrate-cleanup-duplicates.sql:ro
      - ./database/migrations/20260413_merge_noilly_prat.sql:/docker-entrypoint-initdb.d/05-migrate-noilly-prat.sql:ro
      - ./database/migrations/20260414_lachs_karton_grana_gehobelt.sql:/docker-entrypoint-initdb.d/06-migrate-lachs-grana.sql:ro
      - ./database/migrations/20260414_order_email_subject_template.sql:/docker-entrypoint-initdb.d/07-migrate-order-email-subject.sql:ro
      - ./database/migrations/20260412_suppliers_address_attach_pdf.sql:/docker-entrypoint-initdb.d/08-migrate-suppliers-address.sql:ro
      - ./database/migrations/20260413_suppliers_email_subject_template.sql:/docker-entrypoint-initdb.d/09-migrate-suppliers-email-subject.sql:ro
      - ./database/migrations/20260415_user_roles.sql:/docker-entrypoint-initdb.d/10-migrate-user-roles.sql:ro
      - ./database/migrations/20260601_items_valuation_price.sql:/docker-entrypoint-initdb.d/11-migrate-items-valuation-price.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
